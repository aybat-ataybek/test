<style>
:root {
    --bg: #0b0b0d;
    --card: rgba(20, 20, 20, .55);
    --button: rgba(255, 255, 255, .035);
    --white: #f5f5f5;
    --gray: #929292;
    --red: #ff2252;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 100%; min-height: 100%; }

body {
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
}

.background-effects {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    contain: strict;
    background:
        radial-gradient(circle at 50% 30%, rgba(255, 34, 82, .16), transparent 40%),
        var(--bg);
}

#particles-js {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    contain: strict;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .55);
    animation: particleMove linear infinite;
    will-change: transform;
}

@keyframes particleMove {
    from { transform: translate3d(0, 105vh, 0); }
    to   { transform: translate3d(0, -10vh, 0); }
}

#profile-container-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    min-height: 350px;
    padding: 25px;
    overflow: hidden;
    contain: layout paint;
    background: var(--card);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    box-shadow:
        0 4px 24px rgba(0, 0, 0, .25),
        0 0 35px rgba(255, 34, 82, .08);
    transform: perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1);
    transform-style: preserve-3d;
    transition: transform .15s ease;
    animation: profileAppear .45s ease-out;
    will-change: transform;
}

@keyframes profileAppear {
    from {
        opacity: 0;
        transform: perspective(1000px) translate3d(0, 15px, 0) scale3d(.98, .98, 1);
    }
    to {
        opacity: 1;
        transform: perspective(1000px) translate3d(0, 0, 0) scale3d(1, 1, 1);
    }
}

@media (max-width: 600px) {
    #profile-container-inner {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
}

#profile-bg-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: inherit;
    background:
        radial-gradient(circle at 30% 20%, rgba(255, 34, 82, .12), transparent 42%),
        radial-gradient(circle at 80% 80%, rgba(118, 28, 255, .08), transparent 45%),
        rgba(20, 20, 20, .55);
}

#profile-bg-container::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    left: -100px;
    top: -130px;
    border-radius: 50%;
    background: rgba(255, 34, 82, .10);
    filter: blur(65px);
    animation: backgroundGlow 7s ease-in-out infinite alternate;
    will-change: transform;
}

@keyframes backgroundGlow {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(80px, 40px, 0) scale(1.15); }
}

.profile-content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.banner {
    position: relative;
    width: 100%;
    height: 150px;
    overflow: hidden;
    border-radius: 12px;
    background: #bd0039;
}

.banner img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: 68% center;
    transform: scale(1.04);
    user-select: none;
    transition: transform .7s ease;
}

.banner::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 75px;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(20, 20, 20, .85));
}

.avatar-wrapper {
    position: relative;
    z-index: 10;
    width: 110px;
    height: 110px;
    margin-top: -55px;
    border-radius: 50%;
    isolation: isolate;
}

.avatar-wrapper::before {
    content: "";
    position: absolute;
    inset: -3px;
    z-index: -1;
    border-radius: 50%;
    border: 1px solid rgba(255, 34, 82, .55);
    box-shadow:
        0 0 12px rgba(255, 34, 82, .22),
        0 0 26px rgba(255, 34, 82, .12);
    animation: avatarGlowRing 2.8s ease-in-out infinite;
    transition:
        transform .35s ease,
        opacity .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    pointer-events: none;
}

@keyframes avatarGlowRing {
    0%, 100% {
        transform: scale(1);
        opacity: .75;
        box-shadow:
            0 0 0 0 rgba(255, 34, 82, .35),
            0 0 14px rgba(255, 34, 82, .20),
            0 0 28px rgba(255, 34, 82, .08);
    }
    50% {
        transform: scale(1.10);
        opacity: .38;
        box-shadow:
            0 0 0 9px rgba(255, 34, 82, 0),
            0 0 30px rgba(255, 34, 82, .38),
            0 0 48px rgba(255, 34, 82, .15);
    }
}

.avatar {
    position: relative;
    z-index: 2;
    width: 110px;
    height: 110px;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    background: transparent;
    box-shadow:
        0 0 0 1px rgba(255, 34, 82, .25),
        0 0 18px rgba(255, 34, 82, .12),
        0 8px 25px rgba(0, 0, 0, .35);
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}

.avatar:hover { transform: scale(1.025); }

.avatar-wrapper:hover::before {
    transform: scale(1.14);
    opacity: 1;
    border-color: rgba(255, 34, 82, .95);
    box-shadow:
        0 0 0 4px rgba(255, 34, 82, .12),
        0 0 22px rgba(255, 34, 82, .55),
        0 0 45px rgba(255, 34, 82, .28),
        0 0 70px rgba(255, 34, 82, .12);
}

.avatar-wrapper:hover .avatar {
    transform: scale(1.035);
    box-shadow:
        0 0 0 1px rgba(255, 34, 82, .35),
        0 0 18px rgba(255, 34, 82, .25),
        0 8px 25px rgba(0, 0, 0, .45);
    filter: brightness(1.04);
}

@media (hover: none) and (pointer: coarse) {
    .avatar-wrapper:active::before {
        transform: scale(1.15);
        opacity: 1;
        border-color: rgba(255, 34, 82, .95);
        box-shadow:
            0 0 0 5px rgba(255, 34, 82, .14),
            0 0 24px rgba(255, 34, 82, .60),
            0 0 50px rgba(255, 34, 82, .30),
            0 0 75px rgba(255, 34, 82, .12);
    }

    .avatar-wrapper:active .avatar {
        transform: scale(1.04);
        box-shadow:
            0 0 0 1px rgba(255, 34, 82, .45),
            0 0 20px rgba(255, 34, 82, .30),
            0 8px 25px rgba(0, 0, 0, .45);
    }
}

.name {
    margin-top: 17px;
    font-size: 2.6rem;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -1px;
}

.bio {
    margin-top: 14px;
    color: rgba(255, 255, 255, .75);
    font-size: 15px;
    line-height: 1.5;
}

.views {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--gray);
    font-size: 14px;
}

.views svg {
    width: 14px;
    height: 14px;
    fill: #858585;
    flex-shrink: 0;
}

.links {
    width: 100%;
    max-width: 500px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
}

.link {
    position: relative;
    width: min(100%, 500px);
    min-height: 58px;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    color: var(--white);
    text-decoration: none;
    background: var(--button);
    border: 1px solid rgba(255, 255, 255, .05);
    border-radius: 10px;
    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
}

.link {
    overflow: hidden;
    isolation: isolate;
}

.link:hover {
    transform: translateY(-3px) translate3d(4px, 0, 0) scale(1.005);
    background: rgba(255, 255, 255, .065);
    border-color: rgba(255, 255, 255, .12);
    box-shadow:
        0 12px 28px rgba(0, 0, 0, .28),
        0 0 25px rgba(199, 0, 61, .06);
}

.link:active { transform: scale(.985); }

.link:focus-visible {
    outline: 2px solid #c7003d;
    outline-offset: 3px;
}

.link::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(255, 255, 255, .08);
    opacity: 0;
    transition: opacity .3s ease;
    pointer-events: none;
}

.link:hover::after { opacity: 1; }

.link::before {
    content: "";
    position: absolute;
    top: -30%;
    bottom: -30%;
    left: -130%;
    width: 65%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .065), transparent);
    transform: skewX(-20deg);
    transition: left .65s cubic-bezier(.2, .8, .2, 1);
    pointer-events: none;
    z-index: 0;
}

.link:hover::before { left: 150%; }

.ripple {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .15);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 1;
    animation: rippleEffect .65s ease-out forwards;
}

@keyframes rippleEffect {
    to {
        transform: translate(-50%, -50%) scale(30);
        opacity: 0;
    }
}

.social-icon {
    width: 36px;
    height: 36px;
    margin-right: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #ffffff;
    position: relative;
    z-index: 2;
    transition:
        transform .25s cubic-bezier(.2, .8, .2, 1),
        filter .25s ease;
}

.social-icon svg {
    width: 30px;
    height: 30px;
    fill: #ffffff;
    display: block;
}

.social-icon img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    display: block;
}

.link:hover .social-icon { transform: scale(1.1) rotate(-2deg); }

.roblox-svg {
    width: 36px;
    height: 36px;
    margin-right: 17px;
    display: block;
    flex-shrink: 0;
    fill: #ffffff;
    position: relative;
    z-index: 2;
    transition:
        transform .25s cubic-bezier(.2, .8, .2, 1),
        filter .25s ease;
}

.link:hover .roblox-svg { transform: scale(1.1) rotate(-2deg); }

.link-text {
    position: relative;
    z-index: 2;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    transition: transform .2s ease;
}

.link:hover .link-text { transform: translateX(2px); }

.arrow {
    width: 15px;
    height: 15px;
    margin-left: auto;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    color: #858585;
    transition:
        transform .25s cubic-bezier(.2, .8, .2, 1),
        color .2s ease;
}

.arrow::before,
.arrow::after {
    content: "";
    position: absolute;
    right: 3px;
    width: 8px;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
}

.arrow::before { top: 4px; transform: rotate(45deg); }
.arrow::after  { bottom: 4px; transform: rotate(-45deg); }

.link:hover .arrow {
    color: #ffffff;
    transform: translateX(5px);
}

.app-tooltip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(6px) scale(.96);
    padding: 8px 13px;
    border-radius: 9px;
    background: rgba(18, 18, 20, .96);
    border: 1px solid rgba(255, 255, 255, .10);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    box-shadow: 0 8px 25px rgba(0, 0, 0, .35);
    transition:
        opacity .18s ease,
        transform .18s ease,
        visibility .18s ease;
    z-index: 100;
}

.app-tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 9px;
    height: 9px;
    transform: translateX(-50%) rotate(45deg);
    background: rgba(18, 18, 20, .96);
    border-right: 1px solid rgba(255, 255, 255, .10);
    border-bottom: 1px solid rgba(255, 255, 255, .10);
}

.link.holding .app-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0) scale(1);
}

@media (max-width: 600px) {
    body { padding: 15px; }

    #profile-container-inner {
        padding: 20px;
        max-width: 100%;
    }

    .banner { height: 135px; }
    .links  { max-width: 100%; }
    .link   { width: 100%; }
}

@media (max-width: 400px) {
    body { padding: 10px; }
    #profile-container-inner { padding: 17px; }
    .banner { height: 120px; }
    .name { font-size: 2.15rem; }
}

@media (prefers-reduced-motion: reduce) {
    .particle,
    #profile-bg-container::before {
        animation: none !important;
    }

    .banner img,
    .avatar,
    .link,
    .app-tooltip,
    .arrow {
        transition: none !important;
    }

    .avatar-wrapper::before {
        animation: none !important;
        transition: none !important;
    }
}

.click-spark {
    position: fixed;
    left: 0;
    top: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 999999;
    animation: click-spark-animation 500ms ease-out forwards;
}

@keyframes click-spark-animation {
    0% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(0);
    }
}
</style>
</head>

<script>
/* ЧАСТИЦЫ */
function createParticles() {
    const particles = document.getElementById("particles-js");
    const fragment = document.createDocumentFragment();
    const count = window.matchMedia("(max-width:600px)").matches ? 12 : 20;

    for (let i = 0; i < count; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (8 + Math.random() * 12) + "s";
        particle.style.animationDelay = (-Math.random() * 15) + "s";
        particle.style.opacity = .15 + Math.random() * .65;
        fragment.appendChild(particle);
    }

    particles.appendChild(fragment);
}

/* НАКЛОН КАРТОЧКИ (ПК) */
const card = document.getElementById("profile-container-inner");

let mouseX = 0;
let mouseY = 0;
let animationFrame = null;
let isTouching = false;

function updateCardTilt() {
    animationFrame = null;

    if (isTouching || window.innerWidth <= 600) return;

    const rect = card.getBoundingClientRect();
    const x = mouseX - rect.left;
    const y = mouseY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateY = Math.max(-4, Math.min(4, ((x - centerX) / centerX) * 4));
    const rotateX = Math.max(-4, Math.min(4, ((centerY - y) / centerY) * 4));

    card.style.transform = `
        perspective(1000px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale3d(1.01, 1.01, 1.01)
    `;
}

document.addEventListener("mousemove", function (event) {
    if (window.innerWidth <= 600 || isTouching) return;

    mouseX = event.clientX;
    mouseY = event.clientY;

    if (animationFrame === null) {
        animationFrame = requestAnimationFrame(updateCardTilt);
    }
}, { passive: true });

function resetCard() {
    card.style.transform = `
        perspective(1000px)
        rotateX(0deg)
        rotateY(0deg)
        scale3d(1, 1, 1)
    `;
}

document.addEventListener("mouseleave", resetCard);

/* НАКЛОН КАРТОЧКИ (ТЕЛЕФОН) */
function updateTouchTilt(touchX, touchY) {
    const rect = card.getBoundingClientRect();
    const x = touchX - rect.left;
    const y = touchY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateY = Math.max(-6, Math.min(6, ((x - centerX) / centerX) * 6));
    const rotateX = Math.max(-6, Math.min(6, ((centerY - y) / centerY) * 6));

    card.style.transform = `
        perspective(1000px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        scale3d(.985, .985, .985)
    `;
}

card.addEventListener("touchstart", function (event) {
    isTouching = true;
    const touch = event.touches[0];
    updateTouchTilt(touch.clientX, touch.clientY);
}, { passive: true });

card.addEventListener("touchmove", function (event) {
    if (!isTouching) return;
    const touch = event.touches[0];
    updateTouchTilt(touch.clientX, touch.clientY);
}, { passive: true });

card.addEventListener("touchend", function () {
    isTouching = false;
    resetCard();
});

card.addEventListener("touchcancel", function () {
    isTouching = false;
    resetCard();
});

/* СЧЁТЧИК ПРОСМОТРОВ */
const viewCountElement = document.getElementById("viewCount");

async function updateViewCounter() {
    if (!viewCountElement) return;

    viewCountElement.textContent = "...";

    const urls = [
        "https://api.counterapi.dev/v1/aybat-bio-ataybek/page-views/up",
        "https://abacus.jasoncameron.dev/hit/aybat-bio-ataybek/page-views"
    ];

    for (const url of urls) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);

            const data = await res.json();
            const value = data.count ?? data.value;

            if (typeof value === "number") {
                viewCountElement.textContent = value.toLocaleString("ru-RU");
                return;
            }
        } catch (error) {
            console.error("View counter error:", error);
        }
    }

    viewCountElement.textContent = "—";
}

updateViewCounter();

/* ПОДСКАЗКИ ПРИ УДЕРЖАНИИ */
const links = document.querySelectorAll(".link");

links.forEach(function (link) {
    let holdTimer = null;

    function startHold() {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(function () {
            link.classList.add("holding");
        }, 500);
    }

    function stopHold() {
        clearTimeout(holdTimer);
        link.classList.remove("holding");
    }

    link.addEventListener("touchstart", startHold, { passive: true });

    link.addEventListener("touchend", function () {
        clearTimeout(holdTimer);
        setTimeout(function () {
            link.classList.remove("holding");
        }, 50);
    });

    link.addEventListener("touchcancel", stopHold);

    link.addEventListener("mousedown", function (event) {
        if (event.button !== 0) return;
        startHold();
    });

    link.addEventListener("mouseup", stopHold);
    link.addEventListener("mouseleave", stopHold);
});

/* RIPPLE */
links.forEach(function (link) {
    link.addEventListener("click", function (event) {
        const rect = link.getBoundingClientRect();
        const ripple = document.createElement("span");

        ripple.className = "ripple";
        ripple.style.left = (event.clientX - rect.left) + "px";
        ripple.style.top = (event.clientY - rect.top) + "px";

        link.appendChild(ripple);

        setTimeout(function () {
            ripple.remove();
        }, 700);
    });
});

/* ЗАПУСК ЧАСТИЦ */
if ("requestIdleCallback" in window) {
    requestIdleCallback(createParticles);
} else {
    setTimeout(createParticles, 100);
}

/* ИСКРЫ ПРИ КЛИКЕ */
(function () {
    const color = "#ff3b30";

    function createSparks(event) {
        for (let i = 0; i < 8; i++) {
            const spark = document.createElement("div");

            spark.className = "click-spark";
            spark.style.left = `${event.clientX}px`;
            spark.style.top = `${event.clientY}px`;

            const angle = i / 8 * Math.PI * 2;
            const distance = 30 + Math.random() * 25;

            spark.style.backgroundColor = color;
            spark.style.setProperty("--tx", `${Math.cos(angle) * distance}px`);
            spark.style.setProperty("--ty", `${Math.sin(angle) * distance}px`);

            document.body.appendChild(spark);

            setTimeout(function () {
                spark.remove();
            }, 500);
        }
    }

    window.addEventListener("click", createSparks);
})();
</script>
